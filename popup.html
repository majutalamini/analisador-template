<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Analisador de Templates</title>
<style>
  :root {
    --bg-1: #1a1033;
    --bg-2: #150c29;
    --panel: #241a44;
    --panel-2: #2c2054;
    --border: #3c2f68;
    --text: #ede9fe;
    --muted: #a99fd1;
    --accent: #a374ff;
    --accent-2: #7c3aed;
    --accent-soft: rgba(163, 116, 255, 0.16);
    --err: #ff6b8b;
    --err-soft: rgba(255, 107, 139, 0.14);
    --ok: #3ddc97;
    --ok-soft: rgba(61, 220, 151, 0.14);
    --shadow: 0 8px 24px rgba(20, 8, 50, 0.45);
  }

  * { box-sizing: border-box; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--panel-2); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-2); }

  html, body { height: 100%; }

  body {
    width: 100%;
    min-width: 300px;
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(120% 100% at 0% 0%, rgba(163, 116, 255, 0.20), transparent 55%),
      radial-gradient(120% 100% at 100% 0%, rgba(124, 58, 237, 0.18), transparent 50%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
    color: var(--text);
  }

  header {
    padding: 18px 18px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(163, 116, 255, 0.14), transparent 70%);
    pointer-events: none;
  }
  .logo {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: block;
    box-shadow: 0 4px 14px rgba(124, 58, 237, 0.55);
  }
  header .titles { position: relative; }
  header h1 {
    font-size: 15px;
    margin: 0 0 2px;
    font-weight: 700;
    letter-spacing: 0.1px;
  }
  header p { font-size: 11.5px; color: var(--muted); margin: 0; }

  /* Tabs */
  .tab-bar {
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 14px;
    background: rgba(0, 0, 0, 0.10);
    gap: 2px;
  }
  .tab {
    background: none;
    border: none;
    color: var(--muted);
    padding: 10px 14px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    border-radius: 6px 6px 0 0;
  }
  .tab:hover { color: var(--text); background: rgba(163, 116, 255, 0.07); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Panels */
  .panel-content { display: none; flex-direction: column; }
  .panel-content.active { display: flex; }

  /* Analyze panel */
  #panel-analyze {
    padding: 16px 18px 18px;
    gap: 16px;
  }

  label.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  .file-drop {
    position: relative;
    border: 1px dashed var(--border);
    border-radius: 10px;
    background: var(--panel);
    padding: 10px 12px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .file-drop:hover { border-color: var(--accent); background: var(--panel-2); }
  .file-drop:has(input:focus-visible) { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  input[type="file"] {
    width: 100%;
    font-size: 11.5px;
    color: var(--text);
    background: transparent;
    border: none;
    padding: 0;
  }
  input[type="file"]::file-selector-button {
    background: var(--accent-soft);
    color: var(--accent);
    border: none;
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 700;
    margin-right: 10px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  input[type="file"]::file-selector-button:hover { background: rgba(163, 116, 255, 0.28); }
  input[type="file"]::file-selector-button:active { transform: scale(0.97); }

  button#analyzeBtn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
  }
  button#analyzeBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(124, 58, 237, 0.5); }
  button#analyzeBtn:active:not(:disabled) { transform: translateY(0); }
  button#analyzeBtn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  input[type="text"].link-input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 12.5px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"].link-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input[type="text"].link-input::placeholder { color: var(--muted); font-style: italic; }

  .btn-row {
    display: flex;
    gap: 8px;
  }

  button#analyzeLinkBtn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    flex: 1;
    box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
  }
  button#analyzeLinkBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(124, 58, 237, 0.5); }
  button#analyzeLinkBtn:active:not(:disabled) { transform: translateY(0); }
  button#analyzeLinkBtn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }

  button#refreshBtn {
    background: var(--panel);
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    flex: none;
    display: none;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  button#refreshBtn.visible { display: flex; }
  button#refreshBtn:hover:not(:disabled) { border-color: var(--accent); background: var(--panel-2); }
  button#refreshBtn:active:not(:disabled) { transform: scale(0.94); }
  button#refreshBtn:disabled { opacity: 0.45; cursor: default; }
  button#refreshBtn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .field-label-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .info-icon {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(255, 200, 60, 0.16);
    color: #f0c040;
    cursor: help;
    flex: none;
  }
  .info-icon svg { display: block; }

  .info-icon .tooltip {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    bottom: calc(100% + 9px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 11px;
    font-weight: 500;
    text-transform: none;
    letter-spacing: normal;
    line-height: 1.45;
    width: 210px;
    box-shadow: var(--shadow);
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
  }
  .info-icon .tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--panel-2);
  }
  .info-icon:hover .tooltip,
  .info-icon:focus-visible .tooltip {
    visibility: visible;
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  a.ghost-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    background: var(--panel);
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12.5px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  a.ghost-btn:hover { border-color: var(--accent); background: var(--panel-2); }
  a.ghost-btn:active { transform: scale(0.98); }

  .hidden { display: none !important; }

  #status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  #status::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    flex: none;
  }

  #summary {
    display: none;
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 13px;
    font-weight: 700;
    align-items: center;
    gap: 8px;
    border: 1px solid transparent;
  }
  #summary.ok {
    display: flex;
    background: var(--ok-soft);
    color: var(--ok);
    border-color: rgba(61, 220, 151, 0.3);
  }
  #summary.err {
    display: flex;
    background: var(--err-soft);
    color: var(--err);
    border-color: rgba(255, 107, 139, 0.3);
  }

  .list {
    max-height: 55vh;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    display: none;
    background: rgba(0, 0, 0, 0.12);
  }
  .item {
    padding: 11px 13px;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
    line-height: 1.45;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: rgba(163, 116, 255, 0.06); }
  .item .line {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--err);
    background: var(--err-soft);
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .item .snippet {
    color: var(--muted);
    font-size: 11px;
    margin-top: 5px;
    font-style: italic;
  }

  /* Variables panel */
  .var-search-wrap {
    padding: 14px 18px 10px;
  }
  .var-search-wrap input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .var-search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .var-search-wrap input::placeholder { color: var(--muted); font-style: italic; }

  .var-list {
    max-height: 65vh;
    overflow-y: auto;
    padding: 2px 10px 14px;
  }

  .var-badge {
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 5px;
    text-transform: uppercase;
    flex: none;
    min-width: 34px;
    text-align: center;
    letter-spacing: 0.3px;
  }
  .var-badge-var  { background: rgba(163, 116, 255, 0.2); color: var(--accent); }
  .var-badge-img  { background: rgba(61, 220, 151, 0.14); color: var(--ok); }
  .var-badge-loop { background: rgba(255, 200, 60, 0.14); color: #f0c040; }
  .var-badge-col  { background: rgba(100, 180, 255, 0.14); color: #7ec8ff; }
  .var-badge-cond { background: rgba(255, 107, 139, 0.14); color: var(--err); }
  .var-badge-struct { background: rgba(163, 116, 255, 0.2); color: var(--accent); min-width: 58px; }

  /* Category accordion */
  .var-category { border-bottom: 1px solid var(--border); }
  .var-category:last-child { border-bottom: none; }

  .var-category-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 11px 8px;
    cursor: pointer;
    border-radius: 7px;
    transition: background 0.1s;
    user-select: none;
  }
  .var-category-header:hover { background: var(--accent-soft); }

  .var-category-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .var-category-count {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.06);
    padding: 1px 7px;
    border-radius: 10px;
  }
  .var-category-chevron {
    font-size: 10px;
    color: var(--muted);
    transition: transform 0.15s;
    flex: none;
  }
  .var-category.open .var-category-chevron { transform: rotate(180deg); }

  .var-category-grid {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 2px 4px 14px;
  }
  .var-category.open .var-category-grid { display: grid; }
  .var-category-grid.single { grid-template-columns: 1fr; }
  .var-category-grid.single .var-pill-name { white-space: pre-wrap; font-size: 10.5px; }

  .var-pill {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 9px;
    min-height: 46px;
    justify-content: center;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.08s;
  }
  .var-pill:hover { border-color: var(--accent); background: var(--panel-2); }
  .var-pill:active { transform: scale(0.97); }
  .var-pill.copied { border-color: var(--ok); background: var(--ok-soft); }

  .var-pill-tooltip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%) translateY(3px) scale(0.98);
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    white-space: normal;
    width: max-content;
    max-width: 200px;
    box-shadow: var(--shadow);
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.08s ease-out, transform 0.08s ease-out, visibility 0.08s;
  }
  .var-pill-tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--panel-2);
  }
  .var-pill:hover .var-pill-tooltip,
  .var-pill:focus-visible .var-pill-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  .var-pill .var-badge { align-self: flex-start; }

  .var-pill-name {
    font-size: 12.5px;
    color: var(--text);
    font-weight: 600;
    line-height: 1.3;
    word-break: break-word;
  }
  .var-pill.copied .var-pill-name { color: var(--ok); }

  .var-pill-output {
    font-size: 9.5px;
    color: var(--muted);
    font-family: 'Consolas', 'Courier New', monospace;
    line-height: 1.3;
    word-break: break-word;
  }
  .var-pill.copied .var-pill-output { color: var(--ok); opacity: 0.8; }

  .var-empty {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 28px 0;
    font-style: italic;
  }

  footer {
    margin-top: auto;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  small.note { color: var(--muted); font-size: 10.5px; display: block; line-height: 1.5; }
</style>
</head>
<body>
  <header>
    <img class="logo" src="icons/icon48.png" alt="Next Fit" />
    <div class="titles">
      <h1>Analisador de Templates</h1>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab active" data-tab="analyze">Analisar</button>
    <button class="tab" data-tab="variables">Variáveis</button>
  </div>

  <div id="panel-analyze" class="panel-content active">
    <label class="field">
      Template do cliente a analisar (.docx)
      <div class="file-drop">
        <input type="file" id="targetFile" accept=".docx" />
      </div>
    </label>
    <button id="analyzeBtn" disabled>Analisar template</button>

    <div class="divider">ou</div>

    <label class="field">
      <span class="field-label-row">
        Link do Google Docs
        <span class="info-icon" tabindex="0">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span class="tooltip">É necessário que o documento esteja compartilhado como público ("Qualquer pessoa com o link pode visualizar") para que a análise funcione.</span>
        </span>
      </span>
      <input type="text" id="gdocsUrl" class="link-input" placeholder="https://docs.google.com/document/d/..." autocomplete="off" spellcheck="false" />
    </label>
    <div class="btn-row">
      <button id="analyzeLinkBtn" disabled>Analisar link</button>
      <button id="refreshBtn" title="Buscar alterações mais recentes do documento">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>

    <a class="ghost-btn" href="https://docs.google.com/document/u/0/?tgif=d" target="_blank" rel="noopener noreferrer">Abrir Google Docs</a>
    <div id="status" class="hidden"></div>
    <div id="summary"></div>
    <div class="list" id="issueList"></div>
  </div>

  <div id="panel-variables" class="panel-content">
    <div class="var-search-wrap">
      <input type="text" id="varSearch" placeholder="Buscar variável..." autocomplete="off" spellcheck="false" />
    </div>
    <div class="var-list" id="varList">
      <div class="var-empty">Carregando variáveis...</div>
    </div>
  </div>

  <footer>
    <small class="note">Analisador de Templates DOCX — v8.0.0</small>
    <small class="note">Desenvolvido por Maria Julia Talamini</small>
  </footer>

  <script src="jszip.min.js"></script>
  <script src="linter.browser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
